{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contestant Catalog · Survivor Pool</title>

  <link href="https://fonts.googleapis.com/css2?family=Shadows+Into+Light&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'pools/css/contestants.css' %}">
  <link rel="stylesheet" href="{% static 'pools/styles.css' %}">
</head>

<body>
  <main class="catalog-app">

    <!-- Background frame -->
    <img
      class="ct-bg"
      id="ctBg"
      src="{% static 'pools/img/contestant_frame.png' %}"
      alt=""
    >

    <!-- Overlay -->
    <section class="ct-overlay" id="ctOverlay">
      <div class="book-stage">
        <div class="book-frame">

          <div class="book-shell"></div>

          <div id="book" class="book">

            {% for c in contestants %}
            <article class="page" data-contestant-id="{{ c.pk }}">

              <div class="page-inner">

                <!-- LEFT PAGE: PHOTO -->
                <figure class="portrait">

                  {% if c.photo %}
                    <img
                      src="{% static 'pools/cast/season-50/' %}{{ c.photo.name|cut:'cast/season-50/' }}"
                      alt="{{ c.name }}"
                      loading="lazy"
                    >
                  {% else %}
                    <img
                      src="{% static 'pools/img/portrait-placeholder.png' %}"
                      alt="No portrait"
                      loading="lazy"
                    >
                  {% endif %}

                </figure>


                <!-- RIGHT PAGE: ENTRY -->
                <div class="entry">

                  <h2 class="name">
                    {{ c.name }}
                  </h2>


                  <div class="meta">

                    <span class="status {% if c.is_eliminated %}is-out{% else %}is-active{% endif %}">
                      {% if c.is_eliminated %}
                        Eliminated
                      {% else %}
                        Active
                      {% endif %}
                    </span>


                    {% if c.tribe %}
                      <span class="tribe-tag tribe-{{ c.tribe|slugify }}">
                        {{ c.tribe }}
                      </span>
                    {% endif %}

                  </div>


                  <div class="bio-wrap">

                    {% if c.photo %}
                      <div class="bio bio-placeholder"
                          data-bio-url="{% static 'pools/cast/season-50/bios/' %}{{ c.name|slugify }}.txt">
                        No field notes yet.
                      </div>
                    {% else %}
                      <div class="bio bio-placeholder">
                        No field notes yet.
                      </div>
                    {% endif %}

                  </div>

                </div>

              </div>

            </article>
            {% endfor %}

          </div>


          <button id="prevBtn" class="nav-btn nav-btn--prev">
            ◀
          </button>

          <button id="nextBtn" class="nav-btn nav-btn--next">
            ▶
          </button>


        </div>
      </div>
    </section>


  </main>


  <script src="https://unpkg.com/page-flip/dist/page-flip.browser.min.js"></script>

  <script src="{% static 'pools/js/contestants.js' %}"></script>


</body>
</html>
